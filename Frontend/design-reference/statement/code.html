<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rentveda - Account Statement</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1a1c1c",
                        "tertiary": "#4c616c",
                        "on-tertiary-fixed-variant": "#354a53",
                        "on-tertiary-fixed": "#071e27",
                        "on-surface": "#1a1c1c",
                        "surface": "#f9f9f9",
                        "secondary-container": "#e2dfde",
                        "inverse-primary": "#f8bd2a",
                        "primary-fixed-dim": "#f8bd2a",
                        "surface-container-low": "#f3f3f3",
                        "inverse-on-surface": "#f1f1f1",
                        "on-primary-fixed-variant": "#5c4300",
                        "on-secondary-fixed-variant": "#474746",
                        "inverse-surface": "#2f3131",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "primary": "#795900",
                        "primary-container": "#fbc02d",
                        "on-surface-variant": "#4f4633",
                        "tertiary-fixed": "#cfe6f2",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-primary-container": "#6c5000",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#261a00",
                        "tertiary-container": "#b6cdd9",
                        "outline": "#817661",
                        "surface-bright": "#f9f9f9",
                        "on-secondary-container": "#636262",
                        "surface-dim": "#dadada",
                        "surface-container": "#eeeeee",
                        "surface-container-highest": "#e2e2e2",
                        "background": "#f9f9f9",
                        "secondary-fixed": "#e5e2e1",
                        "primary-fixed": "#ffdfa0",
                        "on-tertiary-container": "#425761",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2e2",
                        "surface-tint": "#795900",
                        "secondary-fixed-dim": "#c8c6c5",
                        "secondary": "#5f5e5e",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#b4cad6",
                        "outline-variant": "#d3c5ad",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "base": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "max-width": "1280px"
                    },
                    "fontFamily": {
                        "label-sm": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased pb-[88px] min-h-screen font-body-md">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim shadow-sm docked full-width top-0 sticky z-50 transition-transform duration-200 active:scale-95">
<div class="flex justify-between items-center px-margin-mobile py-base-unit w-full max-w-max-width mx-auto h-[64px]">
<div class="flex items-center gap-gutter">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-container-high p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed tracking-tight">Account Statement</h1>
</div>
<div class="flex items-center">
<!-- Trailing action suppressed for clarity on transactional screen -->
</div>
</div>
</header>
<main class="w-full max-w-2xl mx-auto px-margin-mobile pt-6 pb-24 space-y-8">
<!-- Hero Section: Premium Card -->
<section class="bg-surface-container-lowest border border-surface-variant rounded-xl p-6 shadow-sm flex items-center gap-6">
<div class="bg-primary-container text-on-primary-container p-4 rounded-full flex-shrink-0">
<span class="material-symbols-outlined text-headline-lg" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Generate Report</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Download PDF Statements for your records.</p>
</div>
</section>
<!-- Quick Date Filters -->
<section class="space-y-4">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Quick Select</h3>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center justify-center bg-surface-container-lowest border-2 border-surface-variant hover:border-primary-container rounded-xl p-6 transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent active:scale-95">
<span class="material-symbols-outlined text-tertiary mb-3 group-hover:text-primary-container transition-colors text-[32px]">history</span>
<span class="font-headline-md text-headline-md text-on-surface">This Month</span>
</button>
<button class="flex flex-col items-center justify-center bg-surface-container-lowest border-2 border-surface-variant hover:border-primary-container rounded-xl p-6 transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent active:scale-95">
<span class="material-symbols-outlined text-tertiary mb-3 group-hover:text-primary-container transition-colors text-[32px]">update</span>
<span class="font-headline-md text-headline-md text-on-surface">Last Month</span>
</button>
</div>
</section>
<!-- Custom Date Range -->
<section class="space-y-4">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Custom Range</h3>
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-6 shadow-sm space-y-6">
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="fromDate">From Date</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">calendar_month</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface border border-surface-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-colors" id="fromDate" name="fromDate" type="date"/>
</div>
</div>
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="toDate">To Date</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">event</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface border border-surface-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-colors" id="toDate" name="toDate" type="date"/>
</div>
</div>
</div>
</section>
<!-- Filter Selection -->
<section class="space-y-4">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Record Type</h3>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">filter_list</span>
</div>
<select class="block w-full pl-14 pr-10 py-5 bg-surface-container-lowest border border-surface-variant rounded-xl font-headline-md text-headline-md text-on-surface appearance-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-colors shadow-sm" id="recordType" name="recordType">
<option value="all">All Bills</option>
<option value="paid">Fully Paid</option>
<option value="pending">Pending Dues</option>
</select>
<div class="absolute inset-y-0 right-0 pr-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</section>
</main>
<!-- Primary Action Fixed Bottom -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-variant p-margin-mobile shadow-[0px_-4px_16px_rgba(0,0,0,0.05)] z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-primary-container hover:bg-inverse-primary text-on-primary-container font-headline-md text-headline-md font-bold py-5 rounded-xl transition-all duration-300 active:scale-95 shadow-md flex items-center justify-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">download</span>
                Download PDF Statement
            </button>
</div>
</div>
</body></html>
